name: Integración continua

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  lint:
    name: Sintaxis PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Comprobar sintaxis
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 -P4 php -l

  standards:
    name: Estándares de WordPress
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer
      - name: Validar composer.json
        run: composer validate --no-check-publish --no-check-lock
      - name: Instalar dependencias de desarrollo
        run: composer install --no-interaction --prefer-dist --no-progress
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.GITHUB_TOKEN }}"}}'
      - name: PHP_CodeSniffer
        run: composer run-script phpcs
        continue-on-error: true

  tests:
    name: Pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detectar suite de pruebas
        id: suite
        run: |
          if [ -f phpunit.xml.dist ]; then echo "present=yes" >> "$GITHUB_OUTPUT"; else echo "present=no" >> "$GITHUB_OUTPUT"; echo "Sin suite de pruebas todavía (phpunit.xml.dist ausente)."; fi
      - name: Preparar PHP
        if: steps.suite.outputs.present == 'yes'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer
      - name: Instalar dependencias de desarrollo
        if: steps.suite.outputs.present == 'yes'
        run: composer install --no-interaction --prefer-dist --no-progress
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.GITHUB_TOKEN }}"}}'
      - name: PHPUnit
        if: steps.suite.outputs.present == 'yes'
        run: composer run-script test

  package:
    name: Paquete instalable
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - name: Construir ZIP
        run: bash bin/build-zip.sh
      - name: Guardar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: gestion-de-proyectos
          path: build/*.zip
          if-no-files-found: error
      - name: Publicar versión (solo etiquetas v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.zip
          generate_release_notes: true
